# gitleaks configuration for this repository.
#
# The default rules stay on. Two things are allowlisted, each for a stated reason, and nothing
# else; every other finding still fails the scan:
#   - 0x-prefixed 20-byte addresses and 32-byte hashes: public on-chain identifiers (token and
#     pool addresses, pool ids, Merkle leaves, transaction hashes). This repository is ABOUT a
#     chain; it cannot avoid containing them, and none of them is a credential.
#   - lib/: vendored third-party libraries (OpenZeppelin, forge-std) and their own test vectors.
# The actual secrets this project uses (the deployer key, the RPC key, the relayer's hot key) are
# checked separately by exact match over the full history, which a pattern scanner cannot do.
[extend]
useDefault = true

[allowlist]
description = "public on-chain identifiers and vendored third-party test vectors"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^0x[0-9a-fA-F]{64}$''',
]
paths = [
  '''^lib/''',
]
